services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_APP_URL: https://1pm4tfwd-3000.brs.devtunnels.ms
        NEXT_PUBLIC_APP_DOMAIN: 1pm4tfwd-3000.brs.devtunnels.ms
        NEXT_PUBLIC_RP_ID: 1pm4tfwd-3000.brs.devtunnels.ms
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: UnchartedMannyTestBot
    environment:
      NEXTAUTH_URL: https://1pm4tfwd-3000.brs.devtunnels.ms

  backend:
