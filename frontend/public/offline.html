<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriAgent Pay | Offline</title>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 400px;
    }
    h1 { color: #10b981; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 0.875rem; }
    button {
      background: #10b981;
      color: #030712;
      border: none;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 You are Offline</h1>
    <p>Please check your internet connection. VeriAgent Pay will automatically reconnect when your network returns.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
